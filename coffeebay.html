<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        position: relative;
        height: 100%;
      }
      .swiper {
        width: 100%;
        height: 100%;
      }
      .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #444;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .btncon {
        width: 135px;
        position: absolute;
        bottom: 24.5%;
        right: 25%;
        display: flex;
      }
      .swiper-button-next,
      .swiper-button-prev {
        width: 50px;
        height: 50px;
      }

      .swiper-button-next:after,
      .swiper-button-prev:after {
        content: "";
        width: 50px;
        height: 50px;
        background-position: center;
        background-size: cover;
      }
      .swiper-button-next:after {
        background-image: url(https://www.coffeebay.com/img/main/main_slide_next_btn.png);
      }
      .swiper-button-prev:after {
        background-image: url(https://www.coffeebay.com/img/main/main_slide_prev_btn.png);
      }
    </style>
  </head>
  <body>
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251120102500.jpg"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251120102633.jpg"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251107160153.jpg"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251120102746.11%20%EA%B2%A8%EC%9A%B8%EC%8B%9C%EC%A6%8C_%EB%A9%94%EC%9D%B8%EB%B0%B0%EB%84%88(pc)_%EC%8A%88%ED%86%A8%EB%A0%8C(%ED%95%9C%EC%A0%95%ED%8C%90%EB%A7%A4)_1920x1080px(1)"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251107160036.jpg"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="https://www.coffeebay.com/upload/file_20251120102152.11%20%EA%B2%A8%EC%9A%B8%EC%8B%9C%EC%A6%8C_%EB%A9%94%EC%9D%B8%EB%B0%B0%EB%84%88(pc)_%ED%81%AC%EB%A6%AC%EC%8A%A4%EB%A7%88%EC%8A%A4_1920x1080px"
            alt=""
          />
        </div>
      </div>
      <div class="btncon">
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
      var swiper = new Swiper(".mySwiper", {
        loop: true,
        effect: "fade",
        autoplay: {
          delay: 2500,
          disableOnInteraction: false,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    </script>
  </body>
</html>
